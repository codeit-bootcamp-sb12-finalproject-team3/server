spring:
  application:
    name: moduplaylist-batch

  profiles:
    active: dev

  main:
    web-application-type: servlet

  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}

server:
  port: ${BATCH_MANAGEMENT_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

mopl:
  batch:
    content-tagging:
      # Enable on one batch instance only. Existing completed/failed rows are never retagged.
      enabled: ${CONTENT_TAGGING_ENABLED:false}
      cron: ${CONTENT_TAGGING_CRON:0 * * * * *}
      model: ${CONTENT_TAGGING_MODEL:gpt-4o-mini}
      timeout-seconds: 20
      max-tokens: 1024
      max-items: 500
      synonyms:
        "[시간여행]": "시간 여행"
  sports-import:
    leagues:
      - sport-code: SOCCER
        external-league-id: "4689"
        name: South Korean K League 1
      - sport-code: SOCCER
        external-league-id: "4328"
        name: English Premier League
      - sport-code: SOCCER
        external-league-id: "4331"
        name: German Bundesliga
      - sport-code: SOCCER
        external-league-id: "4335"
        name: Spanish La Liga
      - sport-code: BASKETBALL
        external-league-id: "5124"
        name: Korean Basketball League
      - sport-code: BASKETBALL
        external-league-id: "4387"
        name: NBA
      - sport-code: BASKETBALL
        external-league-id: "4546"
        name: EuroLeague Basketball
