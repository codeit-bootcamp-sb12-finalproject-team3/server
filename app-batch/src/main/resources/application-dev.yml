spring:
  datasource:
    # example address
    url: ${DB_URL:jdbc:mysql://localhost:3306/moduplaylist}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:mopl}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  batch:
    job:
      enabled: false

  ai:
    model:
      chat: none
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.moduplaylist.infrastructure.kafka.event

mopl:
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model: text-embedding-3-small
    dimensions: 1536
  opensearch:
    enabled: ${OPENSEARCH_ENABLED:true}
    uris: ${OPENSEARCH_URIS:http://localhost:9200}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    user-preference-index: user-preference-index
    content-index: content-index
