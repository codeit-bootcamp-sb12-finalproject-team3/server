spring:
  application:
    name: moduplaylist-realtime

  profiles:
    active: dev

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: mopl

realtime:
  sse:
    timeout-millis: ${SSE_TIMEOUT_MILLIS:1800000} # SSE 기본 30 분
  kafka:
    # Each realtime instance needs its own group so every node can inspect its local emitters.
    notification-consumer-group: notification-sse-${REALTIME_INSTANCE_ID:${random.uuid}}
    dm-message-consumer-group: dm-websocket-${REALTIME_INSTANCE_ID:${random.uuid}}