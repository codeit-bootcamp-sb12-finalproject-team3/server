services:
  api:
    image: ${ECR_REGISTRY}/mopl-api:${IMAGE_TAG:-latest}
    container_name: mopl-api
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    networks:
      - mopl-network

  realtime:
    image: ${ECR_REGISTRY}/mopl-realtime:${IMAGE_TAG:-latest}
    container_name: mopl-realtime
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8081:8081"
    networks:
      - mopl-network

  batch:
    image: ${ECR_REGISTRY}/mopl-batch:${IMAGE_TAG:-latest}
    container_name: mopl-batch
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8082:8082"
    networks:
      - mopl-network

networks:
  mopl-network:
    driver: bridge