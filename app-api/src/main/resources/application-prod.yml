spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:openai}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: notification-created:com.moduplaylist.infrastructure.kafka.event.NotificationCreatedKafkaEvent,
          dm-message-created:com.moduplaylist.infrastructure.kafka.event.DmMessageCreatedKafkaEvent,
          content-activity:com.moduplaylist.infrastructure.kafka.event.ContentActivityKafkaEvent,
          content-deleted:com.moduplaylist.infrastructure.kafka.event.ContentDeleted,
          content-upserted:com.moduplaylist.infrastructure.kafka.event.ContentUpserted,
          watchparty-participant-joined:com.moduplaylist.infrastructure.kafka.event.WatchPartyParticipantJoinedKafkaEvent

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: dm-send-requested:com.moduplaylist.infrastructure.kafka.event.DmSendRequestedKafkaEvent,
          dm-message-created:com.moduplaylist.infrastructure.kafka.event.DmMessageCreatedKafkaEvent,
          content-activity:com.moduplaylist.infrastructure.kafka.event.ContentActivityKafkaEvent,
          content-deleted:com.moduplaylist.infrastructure.kafka.event.ContentDeleted,
          content-upserted:com.moduplaylist.infrastructure.kafka.event.ContentUpserted,
          watchparty-participant-joined:com.moduplaylist.infrastructure.kafka.event.WatchPartyParticipantJoinedKafkaEvent
        spring.json.trusted.packages: com.moduplaylist.infrastructure.kafka.event

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId}] [%X{requestMethod} %X{requestUri}] %-5level %logger{36} - %msg%n"

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}

mopl:
  trending:
    processed-event-ttl: ${TRENDING_PROCESSED_EVENT_TTL:7d}
    window-hours: ${TRENDING_WINDOW_HOURS:24}
    bucket-ttl: ${TRENDING_BUCKET_TTL:26h}
    result-cache-ttl: ${TRENDING_RESULT_CACHE_TTL:30s}
    weight:
      content-view: ${TRENDING_CONTENT_VIEW_WEIGHT:0.1}
      content-like: ${TRENDING_CONTENT_LIKE_WEIGHT:1.5}
      rating: ${TRENDING_RATING_WEIGHT:1.0}
      playlist-content: ${TRENDING_PLAYLIST_CONTENT_WEIGHT:0.7}
      watch-party-participation: ${TRENDING_WATCH_PARTY_PARTICIPATION_WEIGHT:1.0}

  recommendation:
    refresh:
      threshold: ${RECOMMENDATION_REFRESH_THRESHOLD:3.0}
      lock-ttl: ${RECOMMENDATION_REFRESH_LOCK_TTL:5m}
    outbox:
      worker-enabled: ${RECOMMENDATION_OUTBOX_WORKER_ENABLED:true}
      polling-interval-ms: ${RECOMMENDATION_OUTBOX_POLLING_INTERVAL_MS:3000}
      claim-limit: ${RECOMMENDATION_OUTBOX_CLAIM_LIMIT:10}
      processing-timeout: ${RECOMMENDATION_OUTBOX_PROCESSING_TIMEOUT:10m}

  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model: text-embedding-3-small
    dimensions: 1536

  search:
    semantic:
      enabled: ${SEMANTIC_SEARCH_ENABLED:true}
      candidate-limit: ${SEMANTIC_SEARCH_CANDIDATE_LIMIT:100}
      minimum-query-length: ${SEMANTIC_SEARCH_MINIMUM_QUERY_LENGTH:3}
      rrf-k: ${SEMANTIC_SEARCH_RRF_K:60}
      keyword-weight: ${SEMANTIC_SEARCH_KEYWORD_WEIGHT:1.0}
      semantic-weight: ${SEMANTIC_SEARCH_SEMANTIC_WEIGHT:0.7}

  opensearch:
    enabled: ${OPENSEARCH_ENABLED:true}
    content-initial-indexing-enabled: ${CONTENT_INITIAL_INDEXING_ENABLED:false}
    uris: ${OPENSEARCH_URIS}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    user-content-preference-index: user-content-preference-index
    user-playlist-preference-index: user-playlist-preference-index
    content-index: content-index
    content-autocomplete-index: content-autocomplete-index
    playlist-index: playlist-index

server:
  forward-headers-strategy: framework