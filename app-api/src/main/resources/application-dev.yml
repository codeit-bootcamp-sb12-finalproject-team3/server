spring:
  datasource:
    # example address
    url: ${DB_URL:jdbc:mysql://localhost:3306/moduplaylist}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:mopl}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: none
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Consumer group-id는 각 @KafkaListener에서 용도별로 지정한다.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: notification-created:com.moduplaylist.infrastructure.kafka.event.NotificationCreatedKafkaEvent,
                                  dm-message-created:com.moduplaylist.infrastructure.kafka.event.DmMessageCreatedKafkaEvent
        #                           real-time과 연동되는 event에 대해서 밑에 예시 처럼 작성하시면 됩니다. Java FQCN type-mapping 한다고 알려주시면 돼요
        #                          , watchparty-playback:com.moduplaylist.infrastructure.kafka.event.WatchPartyPlaybackKafkaEvent

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: dm-send-requested:com.moduplaylist.infrastructure.kafka.event.DmSendRequestedKafkaEvent
        spring.json.trusted.packages: com.moduplaylist.infrastructure.kafka.event

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId}] [%X{requestMethod} %X{requestUri}] %-5level %logger{36} - %msg%n"

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}

mopl:
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    model: text-embedding-3-small
    dimensions: 1536
  opensearch:
    enabled: ${OPENSEARCH_ENABLED:false}
    uris: ${OPENSEARCH_URIS:http://localhost:9200}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    user-preference-index: user-preference-index
    content-index: content-index
