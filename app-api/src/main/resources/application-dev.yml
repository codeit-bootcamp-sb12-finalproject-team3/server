spring:
  datasource:
    # example address
    url: ${DB_URL:jdbc:mysql://localhost:3306/moduplaylist}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:mopl}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Consumer group-id는 각 @KafkaListener에서 용도별로 지정한다.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.moduplaylist.infrastructure.kafka.event

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId}] [%X{requestMethod} %X{requestUri}] %-5level %logger{36} - %msg%n"

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}