spring:
  application:
    name: moduplaylist-api

  config:
    import: "optional:file:./.env[.properties]"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB



  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

mopl:
  oauth2:
    frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:5173/#/oauth/callback}
    frontend-login-url: ${OAUTH2_FRONTEND_LOGIN_URL:http://localhost:5173/sign-in}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: mopl
    access-token-validity-seconds: 3600 # 1시간
    refresh-token-validity-seconds: 86400 # 1일
    cookie-secure: ${JWT_COOKIE_SECURE:true}

